(1px)}.btn.primary{background:linear-gradient(135deg,#4c62db,#394dbb);border-color:#4257c9;color:#fff;box-shadow:0 5px 14px #4257c92b}.btn.primary:hover{box-shadow:0 8px 18px #4257c93b}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.note{font-size:12px;color:var(--muted);margin-top:16px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:linear-gradient(180deg,#fff 0%,#fbfcff 100%);border-right:1px solid #e2e7f2;padding:27px 15px 20px;display:flex;flex-direction:column;gap:34px;position:sticky;top:0;height:100vh;box-shadow:5px 0 24px rgba(28,43,77,.025)}.sidebar .brand{padding:0 8px;font-size:21px;letter-spacing:-.65px}.sidebar .logo{width:42px;height:42px;border-radius:14px;box-shadow:0 7px 16px #4257c92e}.nav-label{color:#8995a8;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:0 13px;margin-bottom:11px}.nav{display:flex;gap:13px;align-items:center;padding:12px 13px;border:1px solid transparent;border-radius:12px;color:#58667d;font-weight:620;margin-top:5px;transition:background .18s,color .18s,border-color .18s,transform .18s}.nav:hover{background:#f5f7ff;color:var(--accent);transform:translateX(2px)}.nav.active{background:linear-gradient(105deg,#edf0ff,#f4f5ff);border-color:#e3e7ff;color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);font-weight:750}.nav span:first-child{width:21px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:17px 8px 0}.user-row{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;background:linear-gradient(145deg,#edf0ff,#e3e8ff);color:var(--accent);border:1px solid #dfe5ff;border-radius:13px;display:grid;place-items:center;font-weight:800}.user-meta b{font-size:12px}.side-bottom #logout{margin-top:13px!important;background:#fff;color:#596780;border-color:#e4e8f0}.side-bottom #logout:hover{background:#fff3f2;color:#b54747;border-color:#f1d5d3}.main{padding:32px clamp(18px,3vw,44px);min-width:0;max-width:1680px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:29px}.top h1{font-size:28px;line-height:1.2;letter-spacing:-1px;margin:0 0 7px}.top p{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:25px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:20px;min-width:0}.stat-label{color:var(--muted);font-size:12px;font-weight:650}.stat-value{font-size:28px;font-weight:780;letter-spacing:-1px;margin:10px 0 4px;overflow-wrap:anywhere}.stat-foot{font-size:11px;color:var(--muted)}.stat-icon{float:right;background:var(--soft);border-radius:11px;padding:9px;color:var(--accent);font-size:15px}.panel{overflow:hidden}.panel-head{padding:21px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;letter-spacing:-.2px;margin:0 0 4px}.panel-head p{font-size:12px;color:var(--muted);margin:0}.tools{display:flex;gap:8px;align-items:center}.search{width:235px;padding:10px 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;padding:13px 20px;font-size:10px;color:#7c899d;letter-spacing:.9px;text-transform:uppercase;background:#f8faff}td{padding:16px 20px;border-top:1px solid #edf0f5}tbody tr{transition:background .15s}tbody tr:hover{background:#f8faff}.nf-code{font-weight:760}.secondary{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:20px;font-size:11px;font-weight:750;background:#e5f7ee;color:#14794f}.pill.pending{background:#fff2d8;color:#97630b}.row-actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:#fff;color:#627089;border-radius:8px;padding:7px 9px;transition:all .15s}.icon-btn:hover{border-color:#bac5d8;color:var(--accent);background:#f7f8ff}.empty{padding:52px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#111b30a8;backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:4}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(590px,100%);max-height:90vh;overflow:auto;padding:25px;box-shadow:0 25px 80px #0002}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;gap:12px}.modal-head h2{margin:0;font-size:19px;letter-spacing:-.4px}.close{border:0;background:transparent;color:var(--muted);font-size:25px;border-radius:8px}.drop{border:1px dashed #9daee7;background:#f5f6ff;border-radius:14px;text-align:center;padding:27px 15px;margin:15px 0}.drop strong{display:block;margin:8px 0 4px}.drop p{color:var(--muted);font-size:12px;margin:0 0 12px}.drop input{max-width:100%;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fcfdff}.detail span{display:block;font-size:10px;font-weight:750;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}.detail b{overflow-wrap:anywhere}.toast{position:fixed;right:20px;bottom:20px;background:#172235;color:#fff;padding:13px 17px;border-radius:12px;z-index:10;box-shadow:0 8px 28px #0002;max-width:calc(100vw - 40px)}.hidden{display:none!important}.footnote{font-size:11px;color:var(--muted);margin:17px 2px}.mobile-menu{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4257c955;outline-offset:2px}

 color-scheme:dark;

</head><body><div class="app" id="app"></div><div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let invoices=[];let logged=false;let query='';let currentFilter='all';let db;let pendingPaymentReceipt=null;
const DB_NAME='FiscalFlowLocal',DB_VERSION=1;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('invoices'))req.result.createObjectStore('invoices',{keyPath:'id'});if(!req.result.objectStoreNames.contains('settings'))req.result.createObjectStore('settings',{keyPath:'key'})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function getAll(name){return new Promise((resolve,reject)=>{let r=store(name).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(name,value){return new Promise((resolve,reject)=>{let tx=db.transaction(name,'readwrite');tx.objectStore(name).put(value);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}function getSetting(key){return new Promise((resolve,reject)=>{let r=store('settings').get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error)})}
function fmt(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}function downloadData(data,name){if(!data){toast('Arquivo não encontrado');return}const a=document.createElement('a');a.href=data;a.download=name||'documento';document.body.appendChild(a);a.click();a.remove()}
async function hashPassword(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function renderLogin(){const hasPassword=!!(await getSetting('passwordHash'));$('#app').innerHTML=`<div class="login"><form class="login-card" id="login-form"><div class="brand"><div class="logo">▤</div><span>FiscalFlow</span></div><div class="eyebrow">Área restrita · Financeiro</div><h1 class="h1">${hasPassword?'Bem-vindo de volta':'Configure seu acesso'}</h1><p class="sub">${hasPassword?'Entre para acessar suas notas fiscais e comprovantes.':'Crie uma senha para este navegador. Não será possível recuperá-la se você esquecer.'}</p>${hasPassword?'':'<div class="field"><label for="email">NOME DO USUÁRIO (OPCIONAL)</label><input id="email" placeholder="Ex.: Financeiro"></div>'}<div class="field"><label for="password">SENHA</label><input id="password" type="password" minlength="8" placeholder="Mínimo de 8 caracteres" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:10px">${hasPassword?'Entrar no sistema →':'Criar senha e continuar →'}</button><p class="note">Os dados e documentos ficam neste navegador, neste computador. Exporte backups regularmente. Este login simples não substitui a segurança de um servidor.</p></form></div>`;$('#login-form').onsubmit=async e=>{e.preventDefault();const password=$('#password').value,hash=await hashPassword(password),saved=await getSetting('passwordHash');if(saved&&saved!==hash){toast('Senha incorreta');return}if(!saved){await put('settings',{key:'passwordHash',value:hash});await put('settings',{key:'userLabel',value:$('#email')?.value||'Usuário'});toast('Senha configurada neste navegador')}logged=true;invoices=await getAll('invoices');render()}}
function render(){if(!logged){renderLogin();return}const total=invoices.reduce((s,x)=>s+Number(x.amount||0),0),paid=invoices.filter(x=>!!x.receiptData).length,pending=invoices.length-paid;$('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">▤</div><span class="brand-name">FiscalFlow</span></div><div><div class="nav-label">MENU PRINCIPAL</div><div class="nav active"><span>▦</span><span>Visão geral</span></div><div class="nav"><span>▤</span><span>Notas fiscais</span></div><div class="nav"><span>◫</span><span>Comprovantes</span></div><div class="nav"><span>⚙</span><span>Dados locais</span></div></div><div class="side-bottom"><div class="user-row"><div class="avatar">FF</div><div class="user-meta"><b>Usuário único</b><div class="secondary">Armazenamento local</div></div></div><button class="btn" id="logout" style="width:100%;margin-top:15px">↪ Sair</button></div></aside><main class="main"><header class="top"><div><h1>Visão geral</h1><p>Suas notas fiscais e comprovantes, armazenados neste navegador.</p></div><div class="actions"><button class="btn" id="backup-btn">↓ Exportar backup</button><button class="btn" id="restore-btn">↑ Restaurar backup</button><input type="file" id="backup-file" accept="application/json,.json" class="hidden"><button class="btn primary" id="nf-btn">＋ Cadastrar NF</button></div></header><section class="stats"><div class="stat"><span class="stat-icon">▤</span><div class="stat-label">Notas cadastradas</div><div class="stat-value">${invoices.length}</div><div class="stat-foot">Documentos registrados</div></div><div class="stat"><span class="stat-icon">＄</span><div class="stat-label">Valor total das notas</div><div class="stat-value" style="font-size:clamp(19px,2vw,27px)">${fmt(total)}</div><div class="stat-foot">Soma dos valores cadastrados</div></div><div class="stat"><span class="stat-icon">✓</span><div class="stat-label">Com comprovante</div><div class="stat-value">${paid}</div><div class="stat-foot">Notas com pagamento vinculado</div></div><div class="stat"><span class="stat-icon">◷</span><div class="stat-label">Aguardando comprovante</div><div class="stat-value">${pending}</div><div class="stat-foot">Precisam de conferência</div></div></section><section class="panel"><div class="panel-head"><div><h2>Notas fiscais</h2><p>Consulte os dados e gerencie os documentos anexados.</p></div><div class="tools"><input class="search" id="search" placeholder="⌕ Buscar nota ou fornecedor…" value="${esc(query)}"><select class="search" id="filter" style="width:auto"><option value="all" ${currentFilter==='all'?'selected':''}>Todos os status</option><option value="paid" ${currentFilter==='paid'?'selected':''}>Com comprovante</option><option value="pending" ${currentFilter==='pending'?'selected':''}>Sem comprovante</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Nota fiscal</th><th>Fornecedor</th><th>Emissão</th><th>Valor</th><th>Pagamento</th><th>Documentos</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="footnote">Os dados e PDFs ficam no armazenamento local do navegador. Use Exportar backup regularmente; limpar os dados do navegador pode apagar seus registros. O login é simples e não criptografa os arquivos.</p></main></div>`;$('#logout').onclick=()=>{logged=false;renderLogin()};$('#nf-btn').onclick=()=>openReceiptFirst();$('#backup-btn').onclick=exportBackup;$('#restore-btn').onclick=()=>$('#backup-file').click();$('#backup-file').onchange=restoreBackup;$('#search').oninput=e=>{query=e.target.value;renderRows()};$('#filter').onchange=e=>{currentFilter=e.target.value;renderRows()};renderRows()}

<script>
window.fiscalFlowReadPdf = async function(file) {
  if (!window.pdfjsLib) {
    await new Promise((resolve,reject) => {
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=resolve;
      s.onerror=()=>reject(new Error('Não foi possível carregar o leitor de PDF. Verifique a conexão.'));
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n), content=await page.getTextContent();
    const items=content.items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:i.transform[4],y:i.transform[5]}));
    items.sort((a,b)=>Math.abs(a.y-b.y)>2?b.y-a.y:a.x-b.x);
    const rows=[];
    for(const it of items){let row=rows.find(r=>Math.abs(r.y-it.y)<=2);if(!row){row={y:it.y,items:[]};rows.push(row)}row.items.push(it)}
    pages.push(rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.text).join(' ')).join('\n'));
  }
  const result=pages.join('\n').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n');
  if(result.replace(/\s/g,'').length<20)throw new Error('O PDF não contém texto selecionável; preencha os dados manualmente.');
  return result;
};
window.fiscalFlowParseNf = function(text) {
  const raw=String(text||'').replace(/\r/g,'');
  const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const flat=raw.replace(/\s+/g,' ');
  const get=(re,src=flat)=>{const m=src.match(re);return m?m[1].trim():''};
  // Número da NF: não capturar números da data ou de outros campos próximos.
  let number='';
  const directPatterns=[
    /NFS-e\s*\/\s*CHAVE\s*NFS-e\s+(\d{1,15})\s*\//i,
    /Número\s+da\s+NFS-e\s*[:\-]?\s*(\d{1,15})/i,
    /Numero\s+da\s+NFS-e\s*[:\-]?\s*(\d{1,15})/i
  ];
  for(const re of directPatterns){const m=raw.match(re);if(m){number=m[1];break;}}
  if(!number){
    const labelIndex=lines.findIndex(s=>/N[º°.]?\s*da\s+Nota\s+Fiscal/i.test(s));
    if(labelIndex>=0){
      const nearby=lines.slice(labelIndex,Math.min(lines.length,labelIndex+3));
      for(const line of nearby){
        if(/\d{2}[\/.-]\d{2}[\/.-]\d{4}/.test(line))continue;
        const tokens=line.match(/\b\d{1,15}\b/g)||[];
        const candidate=tokens.filter(n=>!/^20\d{2}$/.test(n));
        if(candidate.length)number=candidate[candidate.length-1];
      }
    }
  }
  if(/^20\d{2}$/.test(number))number='';

  const cnpjRe=/\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/;
  let cnpj='';
  const providerIndex=lines.findIndex(s=>/PRESTADOR\s*\/\s*FORNECEDOR|PRESTADOR(?:\s+DE)?\s+SERVI[CÇ]OS|^PRESTADOR$/i.test(s));
  if(providerIndex>=0) for(let i=providerIndex;i<Math.min(lines.length,providerIndex+15)&&!cnpj;i++){const m=lines[i].match(cnpjRe);if(m)cnpj=m[0];}
  if(!cnpj){const m=flat.match(/CNPJ(?:\s*\/\s*CPF(?:\s*\/\s*NIF)?)?\s*[:\-]?\s*(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/i);if(m)cnpj=m[1];}

  let supplier='';
  // Modelos municipais: PRESTADOR seguido de "Razão Social:".
  if(providerIndex>=0){
    for(let i=providerIndex;i<Math.min(lines.length,providerIndex+12);i++){
      const m=lines[i].match(/Raz[aã]o Social\s*:\s*(.+)$/i);
      if(m){supplier=m[1].trim();break;}
    }
  }
  if(!supplier){
    const m=raw.match(/(?:Nome\/Raz[aã]o Social|Raz[aã]o Social)\s*:\s*([^\n\r]+)/i);
    if(m)supplier=m[1].trim();
  }
  // Se houver várias Razão Social, priorizar a que aparece depois de PRESTADOR, antes de TOMADOR.
  if(providerIndex>=0){
    const tomadorIndex=lines.findIndex((s,i)=>i>providerIndex&&/^TOMADOR\b/i.test(s));
    const section=lines.slice(providerIndex+1,tomadorIndex>providerIndex?tomadorIndex:providerIndex+15);
    const row=section.find(s=>/Raz[aã]o Social\s*:/i.test(s));
    if(row){const m=row.match(/Raz[aã]o Social\s*:\s*(.+)$/i);if(m)supplier=m[1].trim();}
  }
  supplier=supplier.replace(/\s+(?:Nome Fantasia|Endere[cç]o|CNPJ|CPF|Inscri[cç][aã]o|E-mail|Fone)\s*:.*/i,'').trim();

  let date='';
  const datePatterns=[
    /DATA E HORA DA EMISS[ÃA]O DA NFS-e\s*[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Data e Hora de Emiss[aã]o da NFS-e\s*[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Data\s+(?:de\s+)?Emiss[aã]o\s*[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Emitido\s+em\s+(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Compet[eê]ncia\s+(?:da\s+NFS-e\s*)?[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i
  ];
  for(const re of datePatterns){const m=flat.match(re);if(m){date=m[3]+'-'+m[2]+'-'+m[1];break;}}
  if(!date){const m=flat.match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})\s+às\s+\d{2}:\d{2}/i);if(m)date=m[3]+'-'+m[2]+'-'+m[1];}

  // Usar apenas o valor explicitamente associado ao rótulo "Valor líquido".
  let amountText='';
  const labelMatch=raw.match(/VALOR\s+L[IÍ]QUIDO\s*(?:\(\s*R\$\s*\)|DA\s+NFS-e)?/i);
  if(labelMatch){
    const fromLabel=raw.slice(labelMatch.index,labelMatch.index+1200);
    const stop=fromLabel.search(/OUTRAS\s+INFORMA[CÇ][ÕO]ES|INFORMA[CÇ][ÕO]ES\s+COMPLEMENTARES/i);
    const section=stop>=0?fromLabel.slice(0,stop):fromLabel;
    const values=[...section.matchAll(/(?:R\$\s*)?([\d.]+,\d{2})/g)];
    if(values.length)amountText=values[values.length-1][1];
  }
  const amount=amountText?Number(amountText.replace(/\./g,'').replace(',','.')):'';
  return {number,supplier,cnpj,date,amount};
};
</script>
<script>
/* FiscalFlow hotfix: bind automatic PDF extraction to the actual NF file input,
   regardless of which modal-opening function the existing UI calls. */
(function(){
  document.addEventListener('change', async function(ev){
    const input=ev.target;
    if(!input || input.id!=='nf-file' || !input.files || !input.files[0]) return;
    const file=input.files[0];
    let status=document.getElementById('parse-status');
    if(!status){
      status=document.createElement('p');
      status.id='parse-status';
      status.className='sub';
      status.setAttribute('aria-live','polite');
      input.closest('.drop')?.insertAdjacentElement('afterend',status);
    }
    const set=(s)=>{ if(status) status.textContent=s; };
    if(file.size>15*1024*1024){set('O PDF ultrapassa o limite de 15 MB.');return;}
    if(typeof fiscalFlowReadPdf!=='function'||typeof fiscalFlowParseNf!=='function'){
      set('O leitor automático não foi carregado. Atualize a página e tente novamente.');return;
    }
    set('Lendo o PDF e identificando os campos…');
    try{
      const raw=await fiscalFlowReadPdf(file);
      const data=fiscalFlowParseNf(raw);
      const assign=(id,val)=>{const el=document.getElementById(id);if(el && val!=='' && val!=null) el.value=val;};
      assign('nf-number',data.number);
      assign('nf-supplier',data.supplier);
      assign('nf-cnpj',data.cnpj);
      assign('nf-date',data.date);
      assign('nf-amount',data.amount);
      const count=[data.number,data.supplier,data.cnpj,data.date,data.amount!==''?data.amount:''].filter(v=>v!==''&&v!=null).length;
      set(count ? 'Leitura concluída: '+count+' de 5 campos identificados. Confira os dados antes de salvar.' : 'O PDF foi lido, mas os campos não foram reconhecidos. Preencha manualmente.');
    }catch(err){set((err&&err.message)||'Falha ao ler o PDF. Preencha os campos manualmente.');}
  }, true);
})();
</script>


<script>
// Melhorias incrementais FiscalFlow: preserva o parser existente e os dados locais.
let extraSupplierFilter='',extraFrom='',extraTo='';
const fiscalFlowRenderBase=window.render;
window.render=function(){fiscalFlowRenderBase();fiscalFlowInstallDashboardTools();fiscalFlowInstallNavActions()};
function fiscalFlowInstallDashboardTools(){
 const tools=document.querySelector('.tools');if(!tools||document.querySelector('#supplier-filter'))return;
 const supplier=document.createElement('input');supplier.id='supplier-filter';supplier.className='search';supplier.placeholder='Filtrar fornecedor…';supplier.setAttribute('aria-label','Filtrar por fornecedor');supplier.style.width='100%';
 const from=document.createElement('input');from.id='date-from';from.type='date';from.className='search';from.setAttribute('aria-label','Emissão a partir de');from.title='Emissão a partir de';from.style.width='100%';
 const to=document.createElement('input');to.id='date-to';to.type='date';to.className='search';to.setAttribute('aria-label','Emissão até');to.title='Emissão até';to.style.width='100%';
 tools.append(supplier,from,to);
 supplier.value=extraSupplierFilter;from.value=extraFrom;to.value=extraTo;
 supplier.oninput=()=>{extraSupplierFilter=supplier.value;renderRows()};
 from.onchange=()=>{extraFrom=from.value;renderRows()};
 to.onchange=()=>{extraTo=to.value;renderRows()};
}
function fiscalFlowInstallNavActions(){
 const navs=[...document.querySelectorAll('.nav')];
 navs.forEach(n=>{const label=n.innerText.trim();if(n.dataset.fiscalFlowBound)return;n.dataset.fiscalFlowBound='1';n.style.cursor='pointer';n.addEventListener('click',()=>{
  if(label.includes('Comprovantes'))fiscalFlowOpenReceipts();
  else if(label.includes('Notas fiscais')){document.querySelector('#search')?.focus();document.querySelector('.panel')?.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(label.includes('Dados locais'))fiscalFlowLocalInfo();
  else if(label.includes('Visão geral'))window.scrollTo({top:0,behavior:'smooth'});
 })});
}
function fiscalFlowOpenReceipts(){
 const rows=invoices.filter(x=>x.receiptData);
 modal('<div class="modal-head"><h2>Gestão de comprovantes</h2><button class="close" id="receipts-close">×</button></div><p class="sub">Comprovantes vinculados às notas. Você pode baixar o arquivo ou abrir a nota para conferir os dados.</p><div id="receipt-list"></div><div class="modal-actions"><button class="btn" id="receipts-close2">Fechar</button></div>');
 const host=document.querySelector('#receipt-list');
 host.innerHTML=rows.length?rows.map(x=>'<div class="detail" style="margin:10px 0"><span>NF '+esc(x.number||'Sem número')+' · '+esc(x.supplier||'Fornecedor não informado')+'</span><b>'+esc(x.receiptName||'Comprovante anexado')+'</b><div class="secondary">Pagamento: '+date(x.receiptDate)+'</div><div class="modal-actions"><button class="btn small" data-receipt-download="'+esc(x.id)+'">↓ Baixar comprovante</button><button class="btn small" data-receipt-view="'+esc(x.id)+'">Ver nota</button></div></div>').join(''):'<div class="empty"><b>Nenhum comprovante encontrado</b>Os comprovantes aparecem aqui depois de vinculados a uma NF.</div>';
 document.querySelector('#receipts-close').onclick=document.querySelector('#receipts-close2').onclick=closeModal;
 host.querySelectorAll('[data-receipt-download]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.receiptDownload,'receipt'));
 host.querySelectorAll('[data-receipt-view]').forEach(b=>b.onclick=()=>viewInvoice(b.dataset.receiptView));
}
function fiscalFlowLocalInfo(){
 modal('<div class="modal-head"><h2>Dados locais e segurança</h2><button class="close" id="local-close">×</button></div><p class="sub">O FiscalFlow guarda notas, PDFs e comprovantes no IndexedDB deste navegador. Esses dados não são enviados para uma conta na nuvem.</p><div class="detail-grid"><div class="detail"><span>NOTAS LOCAIS</span><b>'+invoices.length+'</b></div><div class="detail"><span>COMPROVANTES VINCULADOS</span><b>'+invoices.filter(x=>x.receiptData).length+'</b></div></div><p class="note">Exporte um backup JSON antes de limpar dados do navegador ou trocar de computador. A senha local não criptografa os arquivos armazenados.</p><div class="modal-actions"><button class="btn primary" id="local-backup">Exportar backup</button></div>');
 document.querySelector('#local-close').onclick=closeModal;document.querySelector('#local-backup').onclick=exportBackup;
}
const fiscalFlowEditBase=window.editInvoice;
window.editInvoice=function(id){fiscalFlowEditBase(id);const form=document.querySelector('#edit-nf-form');if(form&&!form.querySelector('[name="editing-id"]')){const hidden=document.createElement('input');hidden.type='hidden';hidden.name='editing-id';hidden.value=id;form.appendChild(hidden)}};
document.addEventListener('submit',function(e){
 const form=e.target;if(!form||form.id!=='edit-nf-form')return;
 const id=form.querySelector('[name="editing-id"]')?.value;
 const number=document.querySelector('#edit-number')?.value.trim()||'';
 const supplier=document.querySelector('#edit-supplier')?.value.trim()||'';
 const cnpj=document.querySelector('#edit-cnpj')?.value.trim()||'';
 const issueDate=document.querySelector('#edit-date')?.value||'';
 const amount=document.querySelector('#edit-amount')?.value||'';
 const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
 const cnpjDigits=s=>String(s||'').replace(/\D/g,'');
 const duplicate=invoices.find(x=>x.id!==id&&normalize(x.number)===normalize(number)&&((cnpjDigits(cnpj)&&cnpjDigits(x.cnpj))?cnpjDigits(cnpj)===cnpjDigits(x.cnpj):normalize(x.supplier)===normalize(supplier)));
 const errors=[];
 if(!number)errors.push('informe o número da NF');
 if(!supplier)errors.push('informe o fornecedor');
 if(cnpj&&typeof fiscalFlowValidCnpj==='function'&&!fiscalFlowValidCnpj(cnpj))errors.push('confira os dígitos verificadores do CNPJ');
 if(!issueDate||Number.isNaN(Date.parse(issueDate+'T12:00:00')))errors.push('informe uma data de emissão válida');
 else if(issueDate>new Date().toISOString().slice(0,10))errors.push('a data de emissão não pode estar no futuro');
 if(!amount||!Number.isFinite(Number(amount))||Number(amount)<=0)errors.push('o valor deve ser maior que zero');
 if(duplicate)errors.push('já existe outra nota com esse número e fornecedor/CNPJ');
 if(errors.length){e.preventDefault();e.stopImmediatePropagation();toast('Alterações não salvas: '+errors.join('; '));return}
},true);
// A validação também protege o cadastro novo contra duplicidade e reforça os campos obrigatórios.
document.addEventListener('submit',function(e){
 const form=e.target;if(!form||form.id!=='nf-form')return;
 const number=document.querySelector('#nf-number')?.value.trim()||'',supplier=document.querySelector('#nf-supplier')?.value.trim()||'',cnpj=document.querySelector('#nf-cnpj')?.value.trim()||'';
 const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
 const digits=s=>String(s||'').replace(/\D/g,'');
 const duplicate=invoices.find(x=>normalize(x.number)===normalize(number)&&((digits(cnpj)&&digits(x.cnpj))?digits(cnpj)===digits(x.cnpj):normalize(x.supplier)===normalize(supplier)));
 if(duplicate){e.preventDefault();e.stopImmediatePropagation();const status=document.querySelector('#parse-status');if(status)status.textContent='Cadastro bloqueado: já existe uma NF com esse número para este fornecedor/CNPJ.';toast('Possível nota duplicada. Cadastro bloqueado.')}
},true);
</script>
