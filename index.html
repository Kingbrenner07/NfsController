<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiscalFlow — Gestão de notas</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--text:#182230;--muted:#697586;--line:#e3e8f0;--accent:#4b5fe2;--soft:#eef0ff;--green:#16845b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 20px 70px #0001}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:20px;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:11px;background:#5365e8;color:white;display:grid;place-items:center;font-size:19px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;margin:26px 0 8px}.h1{font-size:26px;letter-spacing:-.8px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--bg);color:var(--text);outline:none}.field input:focus,.search:focus{border-color:var(--accent)}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:var(--panel);color:var(--text);font-weight:650}.btn.primary{background:#5365e8;border-color:#5365e8;color:#fff}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.note{font-size:12px;color:var(--muted);margin-top:16px}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px}.nav-label{color:var(--muted);font-size:10px;font-weight:750;letter-spacing:1.4px;padding:0 12px}.nav{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:9px;color:var(--muted);font-weight:600;margin-top:5px}.nav.active{background:var(--soft);color:var(--accent)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0}.user-row{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;background:var(--soft);color:var(--accent);border-radius:50%;display:grid;place-items:center;font-weight:750}.main{padding:28px clamp(18px,3vw,42px);min-width:0;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:27px}.top h1{font-size:25px;letter-spacing:-.8px;margin:0 0 5px}.top p{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:18px}.stat-label{color:var(--muted);font-size:12px;font-weight:600}.stat-value{font-size:27px;font-weight:750;letter-spacing:-.8px;margin:8px 0 4px}.stat-foot{font-size:11px;color:var(--muted)}.stat-icon{float:right;background:var(--soft);border-radius:9px;padding:8px;color:var(--accent)}.panel{overflow:hidden}.panel-head{padding:19px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:15px;margin:0 0 4px}.panel-head p{font-size:12px;color:var(--muted);margin:0}.tools{display:flex;gap:8px;align-items:center}.search{width:220px;padding:9px 11px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;padding:12px 20px;font-size:10px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;background:#fafbfe}td{padding:15px 20px;border-top:1px solid var(--line)}tbody tr:hover{background:#f7f9ff}.nf-code{font-weight:750}.secondary{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#e6f7ef;color:var(--green)}.pill.pending{background:light-dark(#fff2d7,#46351c);color:light-dark(#9b6811,#ffd27a)}.row-actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:6px 8px}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#0a1020a8;display:grid;place-items:center;padding:20px;z-index:4}.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(570px,100%);max-height:90vh;overflow:auto;padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0;font-size:18px}.close{border:0;background:transparent;color:var(--muted);font-size:23px}.drop{border:1px dashed var(--accent);background:var(--soft);border-radius:12px;text-align:center;padding:25px 15px;margin:14px 0}.drop strong{display:block;margin:8px 0 4px}.drop p{color:var(--muted);font-size:12px;margin:0 0 12px}.drop input{max-width:100%;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:12px;border:1px solid var(--line);border-radius:9px}.detail span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.detail b{overflow-wrap:anywhere}.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:10px;z-index:10;box-shadow:0 8px 28px #0002}.hidden{display:none!important}.footnote{font-size:11px;color:var(--muted);margin:15px 2px}.mobile-menu{display:none}
@media(max-width:950px){.layout{grid-template-columns:70px minmax(0,1fr)}.sidebar{padding:20px 9px}.brand-name,.nav span,.nav-label,.side-bottom .user-meta{display:none}.brand{justify-content:center}.nav{justify-content:center;padding:12px 5px;font-size:18px}.side-bottom{padding:14px 2px}.user-row{justify-content:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.search{width:160px}}
@media(max-width:600px){.main{padding:20px 12px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:23px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:23px}.panel-head{align-items:flex-start;flex-direction:column;padding:15px}.tools{width:100%}.search{flex:1;width:100%;min-width:0}th,td{padding:12px}.detail-grid{grid-template-columns:1fr}.actions{width:100%}}

/* Refinamento visual da barra lateral FiscalFlow */
.sidebar{
 background:linear-gradient(180deg,#fff 0%,#fbfcff 100%);
 border-right:1px solid #e2e7f2;
 padding:27px 15px 20px;
 gap:34px;
 box-shadow:5px 0 24px rgba(28,43,77,.025)
}
.sidebar .brand{padding:0 8px;font-size:21px;letter-spacing:-.65px}
.sidebar .logo{width:42px;height:42px;border-radius:14px;box-shadow:0 7px 16px #4257c92e}
.nav-label{color:#8995a8;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:0 13px;margin-bottom:11px}
.nav{gap:13px;padding:12px 13px;border:1px solid transparent;border-radius:12px;color:#58667d;transition:background .18s,color .18s,border-color .18s,transform .18s}
.nav:hover{background:#f5f7ff;color:var(--accent);transform:translateX(2px)}
.nav.active{background:linear-gradient(105deg,#edf0ff,#f4f5ff);border-color:#e3e7ff;color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);font-weight:750}
.nav span:first-child{width:21px;text-align:center;font-size:17px}
.side-bottom{border-top:1px solid var(--line);padding:17px 8px 0}
.avatar{width:38px;height:38px;background:linear-gradient(145deg,#edf0ff,#e3e8ff);color:var(--accent);border:1px solid #dfe5ff;border-radius:13px}
.side-bottom #logout{margin-top:13px!important;background:#fff;color:#596780;border-color:#e4e8f0}
.side-bottom #logout:hover{background:#fff3f2;color:#b54747;border-color:#f1d5d3}
@media(max-width:760px){
 .sidebar{padding:18px 10px;gap:22px}
 .sidebar .brand{font-size:18px;gap:8px}
 .sidebar .logo{width:36px;height:36px;border-radius:12px}
 .nav{gap:8px;padding:11px 9px;font-size:13px}
 .nav-label{padding:0 8px;letter-spacing:1px}
}


/* Correção de contraste: manter a interface clara e legível */
html{color-scheme:light!important}
body,.app{background:var(--bg);color:var(--text)}
.sidebar{background:linear-gradient(180deg,#fff 0%,#fbfcff 100%);color:#182230}
.sidebar .brand{color:#182230}
.sidebar .brand span,.sidebar .brand strong{color:#182230}
.nav-label{color:#78859a}
.nav{color:#4f5d73}
.nav.active{color:#394dbb;background:linear-gradient(105deg,#edf0ff,#f4f5ff)}
.side-bottom,.side-bottom *{color:inherit}
.side-bottom .user-meta,.side-bottom .user-meta *{color:#596780}
.side-bottom .user-meta b{color:#26334a}
.side-bottom #logout{color:#46546b;background:#fff}
.main{background:transparent;color:var(--text)}
.stat,.panel,.modal,.login-card{background:var(--panel);color:var(--text)}
th{color:#6f7d92}
.secondary,.stat-label,.stat-foot,.panel-head p,.top p{color:var(--muted)}


/* Força paleta clara sem depender de light-dark() do navegador */
:root,html,body{color-scheme:light!important}
body,.app,.main{background-color:#f5f7fb!important;color:#182230!important}
.sidebar{background:#fff!important;color:#182230!important}
.stat,.panel,.modal,.login-card{background-color:#fff!important;color:#182230!important}
th{background:#fafbfe!important;color:#697586!important}
tbody tr:hover{background:#f7f9ff!important}
td{border-top-color:#e3e8f0!important}
.sidebar .brand,.sidebar .brand-name,.sidebar .user-meta b{color:#182230!important}
.sidebar .user-meta,.sidebar .user-meta span{color:#697586!important}
.nav{color:#4f5d73!important}
.nav.active{background:#eef0ff!important;color:#394dbb!important}

</style>
</head><body><div class="app" id="app"></div><div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let invoices=[];let logged=false;let query='';let currentFilter='all';let db;let pendingPaymentReceipt=null;
const DB_NAME='FiscalFlowLocal',DB_VERSION=1;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('invoices'))req.result.createObjectStore('invoices',{keyPath:'id'});if(!req.result.objectStoreNames.contains('settings'))req.result.createObjectStore('settings',{keyPath:'key'})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function getAll(name){return new Promise((resolve,reject)=>{let r=store(name).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(name,value){return new Promise((resolve,reject)=>{let tx=db.transaction(name,'readwrite');tx.objectStore(name).put(value);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}function getSetting(key){return new Promise((resolve,reject)=>{let r=store('settings').get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error)})}
function fmt(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}function downloadData(data,name){if(!data){toast('Arquivo não encontrado');return}const a=document.createElement('a');a.href=data;a.download=name||'documento';document.body.appendChild(a);a.click();a.remove()}
async function hashPassword(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function renderLogin(){const hasPassword=!!(await getSetting('passwordHash'));$('#app').innerHTML=`<div class="login"><form class="login-card" id="login-form"><div class="brand"><div class="logo">▤</div><span>FiscalFlow</span></div><div class="eyebrow">Área restrita · Financeiro</div><h1 class="h1">${hasPassword?'Bem-vindo de volta':'Configure seu acesso'}</h1><p class="sub">${hasPassword?'Entre para acessar suas notas fiscais e comprovantes.':'Crie uma senha para este navegador. Não será possível recuperá-la se você esquecer.'}</p>${hasPassword?'':'<div class="field"><label for="email">NOME DO USUÁRIO (OPCIONAL)</label><input id="email" placeholder="Ex.: Financeiro"></div>'}<div class="field"><label for="password">SENHA</label><input id="password" type="password" minlength="8" placeholder="Mínimo de 8 caracteres" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:10px">${hasPassword?'Entrar no sistema →':'Criar senha e continuar →'}</button><p class="note">Os dados e documentos ficam neste navegador, neste computador. Exporte backups regularmente. Este login simples não substitui a segurança de um servidor.</p></form></div>`;$('#login-form').onsubmit=async e=>{e.preventDefault();const password=$('#password').value,hash=await hashPassword(password),saved=await getSetting('passwordHash');if(saved&&saved!==hash){toast('Senha incorreta');return}if(!saved){await put('settings',{key:'passwordHash',value:hash});await put('settings',{key:'userLabel',value:$('#email')?.value||'Usuário'});toast('Senha configurada neste navegador')}logged=true;invoices=await getAll('invoices');render()}}
function render(){if(!logged){renderLogin();return}const total=invoices.reduce((s,x)=>s+Number(x.amount||0),0),paid=invoices.filter(x=>!!x.receiptData).length,pending=invoices.length-paid;$('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">▤</div><span class="brand-name">FiscalFlow</span></div><div><div class="nav-label">MENU PRINCIPAL</div><div class="nav active"><span>▦</span><span>Visão geral</span></div><div class="nav"><span>▤</span><span>Notas fiscais</span></div><div class="nav"><span>◫</span><span>Comprovantes</span></div><div class="nav"><span>⚙</span><span>Dados locais</span></div></div><div class="side-bottom"><div class="user-row"><div class="avatar">FF</div><div class="user-meta"><b>Usuário único</b><div class="secondary">Armazenamento local</div></div></div><button class="btn" id="logout" style="width:100%;margin-top:15px">↪ Sair</button></div></aside><main class="main"><header class="top"><div><h1>Visão geral</h1><p>Suas notas fiscais e comprovantes, armazenados neste navegador.</p></div><div class="actions"><button class="btn" id="backup-btn">↓ Exportar backup</button><button class="btn" id="restore-btn">↑ Restaurar backup</button><input type="file" id="backup-file" accept="application/json,.json" class="hidden"><button class="btn primary" id="nf-btn">＋ Cadastrar NF</button></div></header><section class="stats"><div class="stat"><span class="stat-icon">▤</span><div class="stat-label">Notas cadastradas</div><div class="stat-value">${invoices.length}</div><div class="stat-foot">Documentos registrados</div></div><div class="stat"><span class="stat-icon">＄</span><div class="stat-label">Valor total das notas</div><div class="stat-value" style="font-size:clamp(19px,2vw,27px)">${fmt(total)}</div><div class="stat-foot">Soma dos valores cadastrados</div></div><div class="stat"><span class="stat-icon">✓</span><div class="stat-label">Com comprovante</div><div class="stat-value">${paid}</div><div class="stat-foot">Notas com pagamento vinculado</div></div><div class="stat"><span class="stat-icon">◷</span><div class="stat-label">Aguardando comprovante</div><div class="stat-value">${pending}</div><div class="stat-foot">Precisam de conferência</div></div></section><section class="panel"><div class="panel-head"><div><h2>Notas fiscais</h2><p>Consulte os dados e gerencie os documentos anexados.</p></div><div class="tools"><input class="search" id="search" placeholder="⌕ Buscar nota ou fornecedor…" value="${esc(query)}"><select class="search" id="filter" style="width:auto"><option value="all" ${currentFilter==='all'?'selected':''}>Todos os status</option><option value="paid" ${currentFilter==='paid'?'selected':''}>Com comprovante</option><option value="pending" ${currentFilter==='pending'?'selected':''}>Sem comprovante</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Nota fiscal</th><th>Fornecedor</th><th>Emissão</th><th>Valor</th><th>Pagamento</th><th>Documentos</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="footnote">Os dados e PDFs ficam no armazenamento local do navegador. Use Exportar backup regularmente; limpar os dados do navegador pode apagar seus registros. O login é simples e não criptografa os arquivos.</p></main></div>`;$('#logout').onclick=()=>{logged=false;renderLogin()};$('#nf-btn').onclick=()=>openReceiptFirst();$('#backup-btn').onclick=exportBackup;$('#restore-btn').onclick=()=>$('#backup-file').click();$('#backup-file').onchange=restoreBackup;$('#search').oninput=e=>{query=e.target.value;renderRows()};$('#filter').onchange=e=>{currentFilter=e.target.value;renderRows()};renderRows()}
function renderRows(){let list=invoices.filter(x=>{let p=(x.number+' '+x.supplier+' '+x.cnpj).toLowerCase().includes(query.toLowerCase());let paid=!!x.receiptData;return p&&(currentFilter==='all'||(currentFilter==='paid'?paid:!paid))});$('#rows').innerHTML=list.length?list.map(x=>`<tr><td><div class="nf-code">NF ${esc(x.number||'Sem número')}</div><div class="secondary">${esc(x.cnpj||'CNPJ não informado')}</div></td><td>${esc(x.supplier||'Fornecedor não identificado')}</td><td>${date(x.date)}</td><td><b>${fmt(x.amount)}</b></td><td><span class="pill ${x.receiptData?'':'pending'}">● ${x.receiptData?'Comprovado':'Pendente'}</span></td><td><div class="secondary">▤ ${x.nfData?'NF anexada':'Sem PDF'} · ◫ ${x.receiptData?'Comprovante anexado':'Sem comprovante'}</div></td><td><div class="row-actions"><button class="icon-btn" title="Ver dados" data-view="${x.id}">◉</button><button class="icon-btn" title="Baixar NF" data-nf="${x.id}" ${x.nfData?'':'disabled'}>↓</button><button class="icon-btn" title="Baixar comprovante" data-receipt="${x.id}" ${x.receiptData?'':'disabled'}>◫</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><b>Nenhuma nota cadastrada</b>Cadastre uma NF em PDF e vincule o comprovante obrigatório.</div></td></tr>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewInvoice(b.dataset.view));document.querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.nf,'nf'));document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.receipt,'receipt'))}
function modal(html){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal">${html}</section></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}function closeModal(){$('#modal-root').innerHTML=''}
function openReceiptFirst(){modal(`<div class="modal-head"><h2>Etapa 1 — Comprovante obrigatório</h2><button class="close" id="close">×</button></div><p class="sub">Anexe o comprovante de pagamento antes de cadastrar a nota fiscal. Os arquivos serão guardados localmente.</p><form id="first-receipt-form"><div class="drop"><div style="font-size:26px">◫</div><strong>Selecione o comprovante de pagamento</strong><p>PDF, PNG ou JPG · até 15 MB</p><input type="file" id="first-receipt-file" accept="application/pdf,image/png,image/jpeg" required></div><div class="field"><label>DATA DO PAGAMENTO</label><input id="first-receipt-date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Continuar para a nota fiscal →</button></div></form>`);$('#close').onclick=$('#cancel').onclick=closeModal;$('#first-receipt-form').onsubmit=async e=>{e.preventDefault();let f=$('#first-receipt-file').files[0];if(!f||f.size>15*1024*1024){toast('Selecione um arquivo de até 15 MB');return}pendingPaymentReceipt={name:f.name,data:await fileData(f),date:$('#first-receipt-date').value};closeModal();openNF()}}

ll;closeModal();render();toast('NF salva com comprovante obrigatório')}catch(err){toast('Não foi possível salvar. Exporte um backup ou libere espaço.')}}}

async function exportBackup(){try{const payload={app:'FiscalFlow',version:1,exportedAt:new Date().toISOString(),invoices,settings:{userLabel:await getSetting('userLabel')}};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fiscalflow-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exportado com documentos')}catch(e){toast('Falha ao exportar backup')}}
async function restoreBackup(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='FiscalFlow'||!Array.isArray(data.invoices))throw new Error('Arquivo inválido');if(!confirm('Restaurar este backup substituirá as notas atualmente salvas. Deseja continuar?'))return;const tx=db.transaction('invoices','readwrite'),os=tx.objectStore('invoices');os.clear();data.invoices.forEach(x=>os.put(x));tx.oncomplete=async()=>{invoices=await getAll('invoices');render();toast('Backup restaurado com sucesso')};tx.onerror=()=>toast('Não foi possível restaurar o backup')}catch(err){toast('Backup inválido ou corrompido')}}

<script>
// Leitura progressiva de PDFs: prioriza rótulos e contexto, sem assumir um único layout.
async function fiscalFlowReadPdf(file){
  if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar o leitor de PDF. Confira a conexão e tente novamente.'));document.head.appendChild(s)});window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let pages=[];
  for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),content=await page.getTextContent(),items=content.items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:i.transform[4],y:i.transform[5]}));items.sort((a,b)=>Math.abs(a.y-b.y)>2?b.y-a.y:a.x-b.x);const rows=[];for(const it of items){let row=rows.find(r=>Math.abs(r.y-it.y)<=2);if(!row){row={y:it.y,items:[]};rows.push(row)}row.items.push(it)}pages.push(rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.text).join(' ')).join('\n'))}
  const text=pages.join('\n').replace(/[\u00a0\u200b\ufeff]/g,' ').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n');if(text.replace(/\s/g,'').length<20)throw new Error('O PDF parece ser digitalizado como imagem. A leitura automática por texto não encontrou conteúdo; preencha os campos manualmente.');return text;
}
function fiscalFlowParseNf(text){
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean),flat=lines.join('\n');const first=(regex,source=flat)=>{const m=source.match(regex);return m?String(m[1]||m[0]).trim():''};
  let number='';
  const numberPatterns=[/(?:N[ÚU]MERO\s+(?:DA\s+)?NFS?-?E|N[ÚU]MERO\s+DA\s+NOTA(?:\s+FISCAL)?|N[ÚU]MERO\s+DA\s+NF)[^\d]{0,80}(\d{1,15})/i,/(?:N[º°.]\s*NFS?-?E|NFS?-?E\s*N[º°.]?)[^\d]{0,30}(\d{1,15})/i,/(?:NFS?-?E\s+DE\s+N[ÚU]MERO|NFS?-?E\s+DE\s+N[ÚU]MERO)[^\d]{0,30}(\d{1,15})/i];
  for(const pattern of numberPatterns){const m=flat.match(pattern);if(m){number=m[1];break}}
  if(!number){const receipt=flat.match(/NFS?-?E\s+DE\s+N[ÚU]MERO\s+(\d{1,15})/i);if(receipt)number=receipt[1]}
  if(!number){const access=flat.match(/(\d{30,})/);if(access){const key=access[1];const m=key.match(/0000000000(\d{1,15})/);if(m)number=m[1]}}
  let cnpj=first(/(?:CPF\s*\/\s*CNPJ(?:\s*\/\s*NIF)?|CNPJ(?:\s+DO\s+(?:EMITENTE|PRESTADOR|FORNECEDOR))?)[^\d]{0,50}(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/i);
  if(!cnpj) cnpj=first(/\b(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})\b/);
  const dateMatch=flat.match(/(?:DATA(?:\s+E\s+HORA)?\s+(?:(?:DE|DA)\s+)?EMISS[AÃ]O(?:\s+DA\s+NFS?-?E)?|EMITIDA\s+EM)[^\d]{0,140}(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i);const iso=dateMatch?`${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`:'';
  let amount=first(/(?:VALOR\s+TOTAL\s+(?:DA\s+)?(?:NOTA|NFS?-?E|DOS\s+SERVI[CÇ]OS)?|VALOR\s+L[IÍ]QUIDO\s+DA\s+NFS?-?E|TOTAL\s+DA\s+NOTA)[^\dR$]{0,60}R?\$?\s*([\d.]+,\d{2}|\d+,\d{2}|\d+\.\d{2})/i);
  if(!amount) amount=first(/VALOR\s+DA\s+OPERA[CÇ][AÃ]O\s*\/\s*SERVI[CÇ]O[^\dR$]{0,50}R?\$?\s*([\d.]+,\d{2}|\d+,\d{2}|\d+\.\d{2})/i);
  const money=amount?Number(amount.replace(/\./g,'').replace(',','.')):NaN;
  const badName=s=>!s||s.length<4||s.length>140||/(?:PARA CERTIFICA[CÇ][AÃ]O|AUTENTICIDADE ACESSE|CHAVE DE ACESSO|C[ÓO]DIGO DE VERIFICA[CÇ][AÃ]O|DOCUMENTO AUXILIAR|NOME\s*\/\s*RAZ[AÃ]O SOCIAL|CPF\s*\/\s*CNPJ|INSCRI[CÇ][AÃ]O ESTADUAL|TOMADOR DE SERVI[CÇ]OS|PRESTADOR DE SERVI[CÇ]OS|DISCRIMINA[CÇ][AÃ]O DOS SERVI[CÇ]OS)/i.test(s);
  let supplier='';
  // Layout DANFSe v2.0: PRESTADOR / FORNECEDOR e nome empresarial aparecem em linhas distintas.
  for(let i=0;i<lines.length;i++){
    if(/PRESTADOR\s*\/\s*FORNECEDOR/i.test(lines[i])){
      for(let j=i+1;j<Math.min(lines.length,i+7);j++){
        if(/NOME\s*\/\s*NOME EMPRESARIAL/i.test(lines[j])){
          const next=lines[j+1]||'';
          const candidate=next.replace(/\s+(?:S[aã]o Lu[ií]s|Bacabeira|Guaramirim)\s*\/\s*[A-Z]{2}\b.*$/i,'').replace(/\s+\d{1,3}\.\d{3,}\s*\/.*$/,'').trim().split(/\s{2,}|\s{3,}/)[0].trim();
          if(!badName(candidate)&&!/^\d/.test(candidate)) supplier=candidate;
          if(!supplier){const m=next.match(/^(.+?)\s{2,}(?:São Luís|[A-ZÀ-Ú][^ ]+\s*\/\s*[A-Z]{2})/i);if(m&&!badName(m[1]))supplier=m[1].trim()}
          if(supplier)break;
        }
      }
    }
    if(supplier)break;
  }
  // Fallback to issuer/prestador blocks in other NF-e and NFS-e layouts.
  if(!supplier) for(let i=0;i<lines.length;i++){
    if(/PRESTADOR DE SERVI[CÇ]OS|IDENTIFICA[CÇ][AÃ]O DO EMITENTE|DADOS DO EMITENTE|DADOS DO PRESTADOR/i.test(lines[i])){
      for(let j=i+1;j<Math.min(lines.length,i+7);j++){let candidate=lines[j].replace(/\b\d{2}\. ?\d{3}\. ?\d{3}\/\d{4}-\d{2}\b/g,' ').replace(/\b\d{6,}\b/g,' ').replace(/\s{2,}/g,' ').trim();if(!badName(candidate)&&/[A-ZÀ-Ú]/i.test(candidate)&&!/^\d/.test(candidate)){supplier=candidate;break}}if(supplier)break
    }
  }
  if(!supplier){for(const line of lines){const m=line.match(/NOME\s*\/\s*(?:RAZ[AÃ]O\s*SOCIAL|NOME EMPRESARIAL)\s+(.+)/i);if(m&&!badName(m[1])){supplier=m[1].replace(/\b\d{2}\. ?\d{3}\. ?\d{3}\/\d{4}-\d{2}\b/g,'').replace(/\b\d{6,}\b/g,'').trim();if(!badName(supplier))break;supplier=''}}}
  if(!supplier){const m=flat.match(/RECEBI\(EMOS\)\s+DE\s+(.+?)\s+O\s+SERVI[CÇ]O\s+CONSTANTE/i);if(m&&!badName(m[1]))supplier=m[1].replace(/\s+(?:S[aã]o Lu[ií]s|Bacabeira)\s*\/\s*[A-Z]{2}.*$/i,'').trim()}
  return {number,supplier,cnpj,date:iso,amount:Number.isFinite(money)?money:''};
}
window.openNF=function(){if(!pendingPaymentReceipt){openReceiptFirst();return}modal(`<div class="modal-head"><h2>Conferir dados da nota fiscal</h2><button class="close" id="close">×</button></div><p class="sub">Comprovante selecionado: <b>${esc(pendingPaymentReceipt.name)}</b>. Confira os dados reconhecidos antes de salvar; campos não identificados podem ser preenchidos manualmente.</p><div class="drop"><strong>Selecione o PDF da nota fiscal</strong><p>PDF · até 15 MB · leitura local no navegador</p><input type="file" id="nf-file" accept="application/pdf" required></div><div id="parse-status" class="sub" aria-live="polite">Aguardando PDF.</div><form id="nf-form"><div class="field"><label>NÚMERO DA NF</label><input id="nf-number" placeholder="Ex.: 000.123.456" required></div><div class="field"><label>FORNECEDOR / RAZÃO SOCIAL</label><input id="nf-supplier" placeholder="Nome da empresa emissora" required></div><div class="field"><label>CNPJ DO FORNECEDOR</label><input id="nf-cnpj" placeholder="00.000.000/0000-00"></div><div class="detail-grid"><div class="field"><label>DATA DE EMISSÃO</label><input id="nf-date" type="date" required></div><div class="field"><label>VALOR TOTAL (R$)</label><input id="nf-amount" type="number" min="0" step="0.01" placeholder="0,00" required></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar NF com comprovante</button></div></form>`);$('#close').onclick=$('#cancel').onclick=closeModal;$('#nf-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const status=$('#parse-status');if(f.size>15*1024*1024){status.textContent='O PDF ultrapassa o limite de 15 MB.';return}status.textContent='Lendo o PDF e identificando os campos…';try{const text=await fiscalFlowReadPdf(f),data=fiscalFlowParseNf(text);$('#nf-number').value=data.number||'';$('#nf-supplier').value=data.supplier||'';$('#nf-cnpj').value=data.cnpj||'';$('#nf-date').value=data.date||'';$('#nf-amount').value=data.amount===''?'':data.amount;const found=[data.number,data.supplier,data.cnpj,data.date,data.amount!==''].filter(Boolean).length;status.textContent=`Leitura concluída: ${found} de 5 campos identificados. Confira os dados antes de salvar.`;if(!found)status.textContent='O texto do PDF foi lido, mas os campos não foram reconhecidos com segurança. Preencha manualmente.'}catch(err){status.textContent=err.message||'Não foi possível ler automaticamente este PDF. Preencha os campos manualmente.'}};$('#nf-form').onsubmit=async e=>{e.preventDefault();const f=$('#nf-file').files[0];if(!f||f.size>15*1024*1024){toast('Anexe um PDF de até 15 MB');return}const record={id:'nf'+Date.now(),number:$('#nf-number').value.trim(),supplier:$('#nf-supplier').value.trim(),cnpj:$('#nf-cnpj').value.trim(),date:$('#nf-date').value,amount:Number($('#nf-amount').value),status:'paid',nfName:f.name,nfData:await fileData(f),receiptName:pendingPaymentReceipt.name,receiptData:pendingPaymentReceipt.data,receiptDate:pendingPaymentReceipt.date,created:new Date().toISOString().slice(0,10)};try{await put('invoices',record);invoices.unshift(record);pendingPaymentReceipt=null;closeModal();render();toast('NF salva com comprovante obrigatório')}catch(err){toast('Não foi possível salvar. Exporte um backup ou libere espaço.')}}};
