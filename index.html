<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiscalFlow — Gestão de notas</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--text:#172235;--muted:#66748a;--line:#e1e7f0;--accent:#4257c9;--soft:#edf0ff;--green:#16845b;--shadow:0 10px 28px rgba(22,34,53,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#e8edff 0,transparent 36%),var(--bg)}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 24px 80px #263b6718}.brand{display:flex;align-items:center;gap:11px;font-weight:780;font-size:20px;letter-spacing:-.5px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#536be7,#3447ad);color:white;display:grid;place-items:center;font-size:19px;box-shadow:0 6px 15px #4257c933}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:750;margin:28px 0 9px}.h1{font-size:28px;line-height:1.2;letter-spacing:-1px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:11px;color:var(--muted);font-weight:750;letter-spacing:.45px}.field input,.field select,.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s}.field input:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4257c91a}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;color:var(--text);font-weight:680;transition:transform .15s,box-shadow .15s,border-color .15s}.btn:hover{border-color:#b7c2d5;box-shadow:0 4px 12px #1722350d}.btn:active{transform:translateY(1px)}.btn.primary{background:linear-gradient(135deg,#4c62db,#394dbb);border-color:#4257c9;color:#fff;box-shadow:0 5px 14px #4257c92b}.btn.primary:hover{box-shadow:0 8px 18px #4257c93b}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.note{font-size:12px;color:var(--muted);margin-top:16px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:linear-gradient(180deg,#fff 0%,#fbfcff 100%);border-right:1px solid #e2e7f2;padding:27px 15px 20px;display:flex;flex-direction:column;gap:34px;position:sticky;top:0;height:100vh;box-shadow:5px 0 24px rgba(28,43,77,.025)}.sidebar .brand{padding:0 8px;font-size:21px;letter-spacing:-.65px}.sidebar .logo{width:42px;height:42px;border-radius:14px;box-shadow:0 7px 16px #4257c92e}.nav-label{color:#8995a8;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:0 13px;margin-bottom:11px}.nav{display:flex;gap:13px;align-items:center;padding:12px 13px;border:1px solid transparent;border-radius:12px;color:#58667d;font-weight:620;margin-top:5px;transition:background .18s,color .18s,border-color .18s,transform .18s}.nav:hover{background:#f5f7ff;color:var(--accent);transform:translateX(2px)}.nav.active{background:linear-gradient(105deg,#edf0ff,#f4f5ff);border-color:#e3e7ff;color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);font-weight:750}.nav span:first-child{width:21px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:17px 8px 0}.user-row{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;background:linear-gradient(145deg,#edf0ff,#e3e8ff);color:var(--accent);border:1px solid #dfe5ff;border-radius:13px;display:grid;place-items:center;font-weight:800}.user-meta b{font-size:12px}.side-bottom #logout{margin-top:13px!important;background:#fff;color:#596780;border-color:#e4e8f0}.side-bottom #logout:hover{background:#fff3f2;color:#b54747;border-color:#f1d5d3}.main{padding:32px clamp(18px,3vw,44px);min-width:0;max-width:1680px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:29px}.top h1{font-size:28px;line-height:1.2;letter-spacing:-1px;margin:0 0 7px}.top p{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:25px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:20px;min-width:0}.stat-label{color:var(--muted);font-size:12px;font-weight:650}.stat-value{font-size:28px;font-weight:780;letter-spacing:-1px;margin:10px 0 4px;overflow-wrap:anywhere}.stat-foot{font-size:11px;color:var(--muted)}.stat-icon{float:right;background:var(--soft);border-radius:11px;padding:9px;color:var(--accent);font-size:15px}.panel{overflow:hidden}.panel-head{padding:21px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;letter-spacing:-.2px;margin:0 0 4px}.panel-head p{font-size:12px;color:var(--muted);margin:0}.tools{display:flex;gap:8px;align-items:center}.search{width:235px;padding:10px 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;padding:13px 20px;font-size:10px;color:#7c899d;letter-spacing:.9px;text-transform:uppercase;background:#f8faff}td{padding:16px 20px;border-top:1px solid #edf0f5}tbody tr{transition:background .15s}tbody tr:hover{background:#f8faff}.nf-code{font-weight:760}.secondary{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:20px;font-size:11px;font-weight:750;background:#e5f7ee;color:#14794f}.pill.pending{background:#fff2d8;color:#97630b}.row-actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:#fff;color:#627089;border-radius:8px;padding:7px 9px;transition:all .15s}.icon-btn:hover{border-color:#bac5d8;color:var(--accent);background:#f7f8ff}.empty{padding:52px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#111b30a8;backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:4}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(590px,100%);max-height:90vh;overflow:auto;padding:25px;box-shadow:0 25px 80px #0002}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;gap:12px}.modal-head h2{margin:0;font-size:19px;letter-spacing:-.4px}.close{border:0;background:transparent;color:var(--muted);font-size:25px;border-radius:8px}.drop{border:1px dashed #9daee7;background:#f5f6ff;border-radius:14px;text-align:center;padding:27px 15px;margin:15px 0}.drop strong{display:block;margin:8px 0 4px}.drop p{color:var(--muted);font-size:12px;margin:0 0 12px}.drop input{max-width:100%;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fcfdff}.detail span{display:block;font-size:10px;font-weight:750;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}.detail b{overflow-wrap:anywhere}.toast{position:fixed;right:20px;bottom:20px;background:#172235;color:#fff;padding:13px 17px;border-radius:12px;z-index:10;box-shadow:0 8px 28px #0002;max-width:calc(100vw - 40px)}.hidden{display:none!important}.footnote{font-size:11px;color:var(--muted);margin:17px 2px}.mobile-menu{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4257c955;outline-offset:2px}
@media(max-width:1050px){.layout{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:22px 10px}.brand-name,.nav span:nth-child(2),.nav-label,.side-bottom .user-meta{display:none}.brand{justify-content:center}.nav{justify-content:center;padding:12px 5px;font-size:18px}.side-bottom{padding:14px 2px}.user-row{justify-content:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.search{width:170px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}}
@media(max-width:680px){.app{background:var(--bg)}.layout{display:block}.sidebar{position:static;height:auto;min-height:0;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 15px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.brand{justify-content:flex-start}.brand-name{display:inline}.sidebar>div:nth-child(2){display:none}.side-bottom{margin:0;border:0;padding:0}.side-bottom .user-row{display:none}.side-bottom #logout{width:auto!important;margin:0!important;padding:8px 10px}.main{padding:23px 13px}.top h1{font-size:25px}.top{gap:15px;margin-bottom:22px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:17px}.stat{padding:14px;border-radius:14px}.stat-value{font-size:23px;margin:8px 0 4px}.stat-label{font-size:11px}.stat-foot{font-size:10px}.stat-icon{padding:7px}.panel{border-radius:14px}.panel-head{align-items:stretch;flex-direction:column;padding:16px;gap:13px}.tools{width:100%;flex-direction:column;align-items:stretch}.search{width:100%;min-width:0}.table-wrap{margin:0 -1px}table{min-width:780px}th,td{padding:12px 14px}.detail-grid{grid-template-columns:1fr}.modal-backdrop{padding:10px;align-items:end}.modal{width:100%;max-height:92vh;border-radius:19px 19px 12px 12px;padding:19px}.drop{padding:22px 12px}.modal-actions .btn{flex:1}.login-card{padding:26px 22px}.toast{left:12px;right:12px;bottom:12px;max-width:none}}
</style>
</head><body><div class="app" id="app"></div><div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let invoices=[];let logged=false;let query='';let currentFilter='all';let db;let pendingPaymentReceipt=null;
const DB_NAME='FiscalFlowLocal',DB_VERSION=1;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('invoices'))req.result.createObjectStore('invoices',{keyPath:'id'});if(!req.result.objectStoreNames.contains('settings'))req.result.createObjectStore('settings',{keyPath:'key'})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function getAll(name){return new Promise((resolve,reject)=>{let r=store(name).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(name,value){return new Promise((resolve,reject)=>{let tx=db.transaction(name,'readwrite');tx.objectStore(name).put(value);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}function getSetting(key){return new Promise((resolve,reject)=>{let r=store('settings').get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error)})}
function fmt(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function date(v){if(!v)return '—';return new Date(v+'T12:00:00').toLocaleDateString('pt-BR')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}function downloadData(data,name){if(!data){toast('Arquivo não encontrado');return}const a=document.createElement('a');a.href=data;a.download=name||'documento';document.body.appendChild(a);a.click();a.remove()}
async function hashPassword(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function renderLogin(){const hasPassword=!!(await getSetting('passwordHash'));$('#app').innerHTML=`<div class="login"><form class="login-card" id="login-form"><div class="brand"><div class="logo">▤</div><span>FiscalFlow</span></div><div class="eyebrow">Área restrita · Financeiro</div><h1 class="h1">${hasPassword?'Bem-vindo de volta':'Configure seu acesso'}</h1><p class="sub">${hasPassword?'Entre para acessar suas notas fiscais e comprovantes.':'Crie uma senha para este navegador. Não será possível recuperá-la se você esquecer.'}</p>${hasPassword?'':'<div class="field"><label for="email">NOME DO USUÁRIO (OPCIONAL)</label><input id="email" placeholder="Ex.: Financeiro"></div>'}<div class="field"><label for="password">SENHA</label><input id="password" type="password" minlength="8" placeholder="Mínimo de 8 caracteres" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:10px">${hasPassword?'Entrar no sistema →':'Criar senha e continuar →'}</button><p class="note">Os dados e documentos ficam neste navegador, neste computador. Exporte backups regularmente. Este login simples não substitui a segurança de um servidor.</p></form></div>`;$('#login-form').onsubmit=async e=>{e.preventDefault();const password=$('#password').value,hash=await hashPassword(password),saved=await getSetting('passwordHash');if(saved&&saved!==hash){toast('Senha incorreta');return}if(!saved){await put('settings',{key:'passwordHash',value:hash});await put('settings',{key:'userLabel',value:$('#email')?.value||'Usuário'});toast('Senha configurada neste navegador')}logged=true;invoices=await getAll('invoices');render()}}
function render(){if(!logged){renderLogin();return}const total=invoices.reduce((s,x)=>s+Number(x.amount||0),0),paid=invoices.filter(x=>!!x.receiptData).length,pending=invoices.length-paid;$('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">▤</div><span class="brand-name">FiscalFlow</span></div><div><div class="nav-label">MENU PRINCIPAL</div><div class="nav active"><span>▦</span><span>Visão geral</span></div><div class="nav"><span>▤</span><span>Notas fiscais</span></div><div class="nav"><span>◫</span><span>Comprovantes</span></div><div class="nav"><span>⚙</span><span>Dados locais</span></div></div><div class="side-bottom"><div class="user-row"><div class="avatar">FF</div><div class="user-meta"><b>Usuário único</b><div class="secondary">Armazenamento local</div></div></div><button class="btn" id="logout" style="width:100%;margin-top:15px">↪ Sair</button></div></aside><main class="main"><header class="top"><div><h1>Visão geral</h1><p>Suas notas fiscais e comprovantes, armazenados neste navegador.</p></div><div class="actions"><button class="btn" id="backup-btn">↓ Exportar backup</button><button class="btn" id="restore-btn">↑ Restaurar backup</button><input type="file" id="backup-file" accept="application/json,.json" class="hidden"><button class="btn primary" id="nf-btn">＋ Cadastrar NF</button></div></header><section class="stats"><div class="stat"><span class="stat-icon">▤</span><div class="stat-label">Notas cadastradas</div><div class="stat-value">${invoices.length}</div><div class="stat-foot">Documentos registrados</div></div><div class="stat"><span class="stat-icon">＄</span><div class="stat-label">Valor total das notas</div><div class="stat-value" style="font-size:clamp(19px,2vw,27px)">${fmt(total)}</div><div class="stat-foot">Soma dos valores cadastrados</div></div><div class="stat"><span class="stat-icon">✓</span><div class="stat-label">Com comprovante</div><div class="stat-value">${paid}</div><div class="stat-foot">Notas com pagamento vinculado</div></div><div class="stat"><span class="stat-icon">◷</span><div class="stat-label">Aguardando comprovante</div><div class="stat-value">${pending}</div><div class="stat-foot">Precisam de conferência</div></div></section><section class="panel"><div class="panel-head"><div><h2>Notas fiscais</h2><p>Consulte os dados e gerencie os documentos anexados.</p></div><div class="tools"><input class="search" id="search" placeholder="⌕ Buscar nota ou fornecedor…" value="${esc(query)}"><select class="search" id="filter" style="width:auto"><option value="all" ${currentFilter==='all'?'selected':''}>Todos os status</option><option value="paid" ${currentFilter==='paid'?'selected':''}>Com comprovante</option><option value="pending" ${currentFilter==='pending'?'selected':''}>Sem comprovante</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Nota fiscal</th><th>Fornecedor</th><th>Emissão</th><th>Valor</th><th>Pagamento</th><th>Documentos</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="footnote">Os dados e PDFs ficam no armazenamento local do navegador. Use Exportar backup regularmente; limpar os dados do navegador pode apagar seus registros. O login é simples e não criptografa os arquivos.</p></main></div>`;$('#logout').onclick=()=>{logged=false;renderLogin()};$('#nf-btn').onclick=()=>openReceiptFirst();$('#backup-btn').onclick=exportBackup;$('#restore-btn').onclick=()=>$('#backup-file').click();$('#backup-file').onchange=restoreBackup;$('#search').oninput=e=>{query=e.target.value;renderRows()};$('#filter').onchange=e=>{currentFilter=e.target.value;renderRows()};renderRows()}
function renderRows(){let list=invoices.filter(x=>{let p=(x.number+' '+x.supplier+' '+x.cnpj).toLowerCase().includes(query.toLowerCase());let paid=!!x.receiptData;return p&&(currentFilter==='all'||(currentFilter==='paid'?paid:!paid))});$('#rows').innerHTML=list.length?list.map(x=>`<tr><td><div class="nf-code">NF ${esc(x.number||'Sem número')}</div><div class="secondary">${esc(x.cnpj||'CNPJ não informado')}</div></td><td>${esc(x.supplier||'Fornecedor não identificado')}</td><td>${date(x.date)}</td><td><b>${fmt(x.amount)}</b></td><td><span class="pill ${x.receiptData?'':'pending'}">● ${x.receiptData?'Comprovado':'Pendente'}</span></td><td><div class="secondary">▤ ${x.nfData?'NF anexada':'Sem PDF'} · ◫ ${x.receiptData?'Comprovante anexado':'Sem comprovante'}</div></td><td><div class="row-actions"><button class="icon-btn" title="Ver dados" data-view="${x.id}">◉</button><button class="icon-btn" title="Editar nota" data-edit="${x.id}">✎</button><button class="icon-btn" title="Baixar NF" data-nf="${x.id}" ${x.nfData?'':'disabled'}>↓</button><button class="icon-btn" title="Baixar comprovante" data-receipt="${x.id}" ${x.receiptData?'':'disabled'}>◫</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><b>Nenhuma nota cadastrada</b>Cadastre uma NF em PDF e vincule o comprovante obrigatório.</div></td></tr>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewInvoice(b.dataset.view));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editInvoice(b.dataset.edit));document.querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.nf,'nf'));document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.receipt,'receipt'))}
function modal(html){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal">${html}</section></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}function closeModal(){$('#modal-root').innerHTML=''}
function openReceiptFirst(){modal(`<div class="modal-head"><h2>Etapa 1 — Comprovante obrigatório</h2><button class="close" id="close">×</button></div><p class="sub">Anexe o comprovante de pagamento antes de cadastrar a nota fiscal. Os arquivos serão guardados localmente.</p><form id="first-receipt-form"><div class="drop"><div style="font-size:26px">◫</div><strong>Selecione o comprovante de pagamento</strong><p>PDF, PNG ou JPG · até 15 MB</p><input type="file" id="first-receipt-file" accept="application/pdf,image/png,image/jpeg" required></div><div class="field"><label>DATA DO PAGAMENTO</label><input id="first-receipt-date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Continuar para a nota fiscal →</button></div></form>`);$('#close').onclick=$('#cancel').onclick=closeModal;$('#first-receipt-form').onsubmit=async e=>{e.preventDefault();let f=$('#first-receipt-file').files[0];if(!f||f.size>15*1024*1024){toast('Selecione um arquivo de até 15 MB');return}pendingPaymentReceipt={name:f.name,data:await fileData(f),date:$('#first-receipt-date').value};closeModal();openNF()}}
function openNF(){if(!pendingPaymentReceipt){openReceiptFirst();return}modal(`<div class="modal-head"><h2>Conferir dados da nota fiscal</h2><button class="close" id="close">×</button></div><p class="sub">Comprovante selecionado: <b>${esc(pendingPaymentReceipt.name)}</b>. Revise os dados extraídos e salve o cadastro.</p><form id="nf-form"><div class="drop"><strong>Selecione o PDF da nota fiscal</strong><p>PDF · até 15 MB</p><input type="file" id="nf-file" accept="application/pdf" required></div><div class="field"><label>NÚMERO DA NF</label><input id="nf-number" placeholder="Ex.: 000.123.456" required></div><div class="field"><label>FORNECEDOR / RAZÃO SOCIAL</label><input id="nf-supplier" placeholder="Nome da empresa emissora" required></div><div class="field"><label>CNPJ DO FORNECEDOR</label><input id="nf-cnpj" placeholder="00.000.000/0000-00"></div><div class="detail-grid"><div class="field"><label>DATA DE EMISSÃO</label><input id="nf-date" type="date" required></div><div class="field"><label>VALOR TOTAL (R$)</label><input id="nf-amount" type="number" min="0" step="0.01" placeholder="0,00" required></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar NF com comprovante</button></div></form>`);$('#close').onclick=$('#cancel').onclick=closeModal;$('#nf-form').onsubmit=async e=>{e.preventDefault();
const candidateNumber=$('#nf-number').value.trim().toLocaleUpperCase('pt-BR').replace(/[^A-Z0-9]/g,'');
const candidateCnpj=$('#nf-cnpj').value.replace(/\D/g,'');
const candidateSupplier=$('#nf-supplier').value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const duplicate=invoices.find(x=>{

 if(!candidateNumber||existingNumber!==candidateNumber)return false;

function viewInvoice(id){let x=invoices.find(x=>x.id===id);if(!x)return;modal(`<div class="modal-head"><h2>Detalhes da nota fiscal</h2><button class="close" id="close">×</button></div><p class="sub">NF ${esc(x.number)} · Cadastrada em ${date(x.created)}</p><div class="detail-grid"><div class="detail"><span>FORNECEDOR</span><b>${esc(x.supplier)}</b></div><div class="detail"><span>CNPJ</span><b>${esc(x.cnpj||'Não informado')}</b></div><div class="detail"><span>DATA DE EMISSÃO</span><b>${date(x.date)}</b></div><div class="detail"><span>VALOR TOTAL</span><b>${fmt(x.amount)}</b></div><div class="detail"><span>PDF DA NOTA</span><b>${esc(x.nfName||'Nenhum arquivo')}</b></div><div class="detail"><span>COMPROVANTE</span><b>${esc(x.receiptName||'Nenhum comprovante')}</b></div><div class="detail"><span>DATA DO PAGAMENTO</span><b>${date(x.receiptDate)}</b></div><div class="detail"><span>STATUS</span><b>${x.receiptData?'Pagamento comprovado':'Pendente'}</b></div></div><div class="modal-actions"><button class="btn" id="close2">Fechar</button><button class="btn" id="edit-detail">✎ Editar dados</button><button class="btn" id="download-receipt" ${x.receiptData?'':'disabled'}>↓ Comprovante</button><button class="btn primary" id="download-detail" ${x.nfData?'':'disabled'}>↓ Baixar PDF</button></div>`);$('#close').onclick=$('#close2').onclick=closeModal;$('#edit-detail').onclick=()=>editInvoice(id);$('#download-detail').onclick=()=>downloadFile(id,'nf');$('#download-receipt').onclick=()=>downloadFile(id,'receipt')}
function editInvoice(id){const x=invoices.find(item=>item.id===id);if(!x)return;modal(`<div class="modal-head"><h2>Editar nota fiscal</h2><button class="close" id="close">×</button></div><p class="sub">Altere os dados necessários. Os documentos já anexados serão mantidos, a menos que você selecione um arquivo substituto.</p><form id="edit-nf-form"><div class="field"><label>NÚMERO DA NF</label><input id="edit-number" value="${esc(x.number)}" required></div><div class="field"><label>FORNECEDOR / RAZÃO SOCIAL</label><input id="edit-supplier" value="${esc(x.supplier)}" required></div><div class="field"><label>CNPJ DO FORNECEDOR</label><input id="edit-cnpj" value="${esc(x.cnpj)}"></div><div class="detail-grid"><div class="field"><label>DATA DE EMISSÃO</label><input id="edit-date" type="date" value="${esc(x.date)}" required></div><div class="field"><label>VALOR TOTAL (R$)</label><input id="edit-amount" type="number" min="0" step="0.01" value="${Number(x.amount)||0}" required></div></div><div class="detail"><span>PDF ATUAL</span><b>${esc(x.nfName||'Nenhum arquivo anexado')}</b><div class="field"><label>SUBSTITUIR PDF (OPCIONAL)</label><input id="edit-nf-file" type="file" accept="application/pdf"></div></div><div class="detail" style="margin-top:12px"><span>COMPROVANTE ATUAL</span><b>${esc(x.receiptName||'Nenhum comprovante anexado')}</b><div class="field"><label>SUBSTITUIR COMPROVANTE (OPCIONAL)</label><input id="edit-receipt-file" type="file" accept="application/pdf,image/png,image/jpeg"></div><div class="field"><label>DATA DO PAGAMENTO</label><input id="edit-receipt-date" type="date" value="${esc(x.receiptDate||'')}"></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel-edit">Cancelar</button><button class="btn primary">Salvar alterações</button></div></form>`);$('#close').onclick=$('#cancel-edit').onclick=closeModal;$('#edit-nf-form').onsubmit=async e=>{e.preventDefault();const nfFile=$('#edit-nf-file').files[0],receiptFile=$('#edit-receipt-file').files[0];if(nfFile&&(nfFile.type!=='application/pdf'||nfFile.size>15*1024*1024)){toast('O novo PDF deve ter até 15 MB');return}if(receiptFile&&(!['application/pdf','image/png','image/jpeg'].includes(receiptFile.type)||receiptFile.size>15*1024*1024)){toast('O comprovante deve ser PDF, PNG ou JPG de até 15 MB');return}try{const updated={...x,number:$('#edit-number').value.trim(),supplier:$('#edit-supplier').value.trim(),cnpj:$('#edit-cnpj').value.trim(),date:$('#edit-date').value,amount:Number($('#edit-amount').value),receiptDate:$('#edit-receipt-date').value||x.receiptDate||''};if(nfFile){updated.nfName=nfFile.name;updated.nfData=await fileData(nfFile)}if(receiptFile){updated.receiptName=receiptFile.name;updated.receiptData=await fileData(receiptFile)}await put('invoices',updated);invoices=invoices.map(item=>item.id===id?updated:item);closeModal();render();toast('Nota fiscal atualizada; documentos preservados')}catch(err){toast('Não foi possível salvar as alterações. Tente exportar um backup.')}}}
function downloadFile(id,type){let x=invoices.find(x=>x.id===id);if(!x)return;downloadData(type==='nf'?x.nfData:x.receiptData,type==='nf'?x.nfName:x.receiptName)}
async function exportBackup(){try{const payload={app:'FiscalFlow',version:1,exportedAt:new Date().toISOString(),invoices,settings:{userLabel:await getSetting('userLabel')}};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fiscalflow-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exportado com documentos')}catch(e){toast('Falha ao exportar backup')}}
async function restoreBackup(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='FiscalFlow'||!Array.isArray(data.invoices))throw new Error('Arquivo inválido');if(!confirm('Restaurar este backup substituirá as notas atualmente salvas. Deseja continuar?'))return;const tx=db.transaction('invoices','readwrite'),os=tx.objectStore('invoices');os.clear();data.invoices.forEach(x=>os.put(x));tx.oncomplete=async()=>{invoices=await getAll('invoices');render();toast('Backup restaurado com sucesso')};tx.onerror=()=>toast('Não foi possível restaurar o backup')}catch(err){toast('Backup inválido ou corrompido')}}

<script>
window.fiscalFlowReadPdf = async function(file) {
  if (!window.pdfjsLib) {
    await new Promise((resolve,reject) => {
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=resolve;
      s.onerror=()=>reject(new Error('Não foi possível carregar o leitor de PDF. Verifique a conexão.'));
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n), content=await page.getTextContent();
    const items=content.items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:i.transform[4],y:i.transform[5]}));
    items.sort((a,b)=>Math.abs(a.y-b.y)>2?b.y-a.y:a.x-b.x);
    const rows=[];
    for(const it of items){let row=rows.find(r=>Math.abs(r.y-it.y)<=2);if(!row){row={y:it.y,items:[]};rows.push(row)}row.items.push(it)}
    pages.push(rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.text).join(' ')).join('\n'));
  }
  const result=pages.join('\n').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n');
  if(result.replace(/\s/g,'').length<20)throw new Error('O PDF não contém texto selecionável; preencha os dados manualmente.');
  return result;
};
window.fiscalFlowParseNf = function(text) {
  const raw=String(text||'').replace(/\r/g,'');
  const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const flat=raw.replace(/\s+/g,' ');
  const get=(re,src=flat)=>{const m=src.match(re);return m?m[1].trim():''};
  let number=get(/NFS-e\s*\/\s*CHAVE\s*NFS-e\s+(\d{1,15})\s*\//i);
  if(!number) number=get(/N[uú]mero\s+da\s+NFS-e\s*[:\-]?\s*(\d{1,15})/i);
  if(!number) {const i=lines.findIndex(s=>/N[uú]mero da NFS-e/i.test(s));if(i>=0)number=lines.slice(i+1,i+4).find(s=>/^\d{1,15}$/.test(s))||'';}

  const cnpjRe=/\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/;
  let cnpj='';
  const providerIndex=lines.findIndex(s=>/PRESTADOR\s*\/\s*FORNECEDOR|PRESTADOR DE SERVI[CÇ]OS/i.test(s));
  if(providerIndex>=0) for(let i=providerIndex;i<Math.min(lines.length,providerIndex+15)&&!cnpj;i++){const m=lines[i].match(cnpjRe);if(m)cnpj=m[0];}
  if(!cnpj){const m=flat.match(/CNPJ(?:\s*\/\s*CPF(?:\s*\/\s*NIF)?)?\s*[:\-]?\s*(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/i);if(m)cnpj=m[1];}

  let supplier='';
  if(providerIndex>=0){
    const nameLabel=lines.findIndex((s,i)=>i>providerIndex&&/Nome\s*\/\s*Nome Empresarial|Nome\/Raz[aã]o Social/i.test(s));
    if(nameLabel>=0){
      for(let i=nameLabel+1;i<Math.min(lines.length,nameLabel+4);i++){
        let s=lines[i].replace(/\s+(?:S[aã]o Lu[ií]s|Munic[ií]pio de)\s*\/.*$/i,'').trim();
        s=s.replace(/\s+\d{5}-\d{3}.*$/,'').trim();
        if(s.length>3&&!/^(CNPJ|CPF|Inscri[cç][aã]o|Munic[ií]pio|Telefone|Endere[cç]o)/i.test(s)){supplier=s;break;}
      }
    }
  }
  if(!supplier){
    const m=flat.match(/(?:Nome\/Raz[aã]o Social|Raz[aã]o Social)\s+(.{3,120}?)\s+(?=CNPJ|CPF|Inscri[cç][aã]o Municipal)/i);
    if(m)supplier=m[1].trim();
  }
  // Corta campos de endereço/município que alguns PDFs colocam na mesma linha do nome.
  supplier=supplier.replace(/\s+(?:S[aã]o Lu[ií]s|Munic[ií]pio|Endere[cç]o|CNPJ|CPF)\b.*$/i,'').trim();
  supplier=supplier.replace(/\s+\d{2}\.\d{3}-\d{3}.*$/,'').trim();

  let date='';
  const datePatterns=[
    /DATA E HORA DA EMISS[ÃA]O DA NFS-e\s*[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Data e Hora de Emiss[aã]o da NFS-e\s*[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Data\s+(?:de\s+)?Emiss[aã]o\s*[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i,
    /Compet[eê]ncia\s+(?:da\s+NFS-e\s*)?[:\-]?\s*(\d{2})[\/.-](\d{2})[\/.-](\d{4})/i
  ];
  for(const re of datePatterns){const m=flat.match(re);if(m){date=m[3]+'-'+m[2]+'-'+m[1];break;}}
  if(!date){const m=flat.match(/(\d{2})\/(\d{2})\/(\d{4})\s+\d{2}:\d{2}:\d{2}/);if(m)date=m[3]+'-'+m[2]+'-'+m[1];}

  let amountText=get(/VALOR DA OPERA[CÇ][AÃ]O\s*\/\s*SERVI[CÇ]O\s*(?:R\$\s*)?([\d.]+,\d{2})/i);
  if(!amountText)amountText=get(/Valor L[ií]quido da NFS-e\s*:?\s*(?:R\$\s*)?([\d.]+,\d{2})/i);
  if(!amountText)amountText=get(/Valor Total dos Servi[cç]os\s*:?\s*(?:R\$\s*)?([\d.]+,\d{2})/i);
  if(!amountText)amountText=get(/Valor dos Servi[cç]os\s*:?\s*(?:R\$\s*)?([\d.]+,\d{2})/i);
  if(!amountText)amountText=get(/VALOR TOTAL\s*:?\s*(?:R\$\s*)?([\d.]+,\d{2})/i);
  if(!amountText)amountText=get(/Total\s+R\$\s*([\d.]+,\d{2})/i);
  // Em alguns PDFs, o rótulo e o valor ficam em linhas separadas.
  if(!amountText){
    const money=/R?\$?\s*([\d.]+,\d{2})\b/;
    const label=/VALOR DA OPERA[CÇ][AÃ]O|VALOR L[IÍ]QUIDO DA NFS-e|VALOR TOTAL DOS SERVI[CÇ]OS|VALOR DOS SERVI[CÇ]OS|VALOR TOTAL/i;
    const stop=/DEDU[CÇ][ÕO]ES|DESCONTO|ISSQN|IRRF|INSS|CSLL|COFINS|PIS|AL[IÍ]QUOTA|VALOR APROXIMADO DOS TRIBUTOS/i;
    for(let i=0;i<lines.length&&!amountText;i++){
      if(!label.test(lines[i]))continue;
      const inline=lines[i].match(money);
      if(inline){amountText=inline[1];break;}
      for(let j=i+1;j<Math.min(lines.length,i+4);j++){
        if(stop.test(lines[j]))break;
        const m=lines[j].match(money);
        if(m){amountText=m[1];break;}
      }
    }
  }
  const amount=amountText?Number(amountText.replace(/\./g,'').replace(',','.')):'';
  return {number,supplier,cnpj,date,amount};
};
</script>
<script>
/* FiscalFlow hotfix: bind automatic PDF extraction to the actual NF file input,
   regardless of which modal-opening function the existing UI calls. */
(function(){
  document.addEventListener('change', async function(ev){
    const input=ev.target;
    if(!input || input.id!=='nf-file' || !input.files || !input.files[0]) return;
    const file=input.files[0];
    let status=document.getElementById('parse-status');
    if(!status){
      status=document.createElement('p');
      status.id='parse-status';
      status.className='sub';
      status.setAttribute('aria-live','polite');
      input.closest('.drop')?.insertAdjacentElement('afterend',status);
    }
    const set=(s)=>{ if(status) status.textContent=s; };
    if(file.size>15*1024*1024){set('O PDF ultrapassa o limite de 15 MB.');return;}
    if(typeof fiscalFlowReadPdf!=='function'||typeof fiscalFlowParseNf!=='function'){
      set('O leitor automático não foi carregado. Atualize a página e tente novamente.');return;
    }
    set('Lendo o PDF e identificando os campos…');
    try{
      const raw=await fiscalFlowReadPdf(file);
      const data=fiscalFlowParseNf(raw);
      const assign=(id,val)=>{const el=document.getElementById(id);if(el && val!=='' && val!=null) el.value=val;};
      assign('nf-number',data.number);
      assign('nf-supplier',data.supplier);
      assign('nf-cnpj',data.cnpj);
      assign('nf-date',data.date);
      assign('nf-amount',data.amount);
      const count=[data.number,data.supplier,data.cnpj,data.date,data.amount!==''?data.amount:''].filter(v=>v!==''&&v!=null).length;
      set(count ? 'Leitura concluída: '+count+' de 5 campos identificados. Confira os dados antes de salvar.' : 'O PDF foi lido, mas os campos não foram reconhecidos. Preencha manualmente.');
    }catch(err){set((err&&err.message)||'Falha ao ler o PDF. Preencha os campos manualmente.');}
  }, true);
})();
</script>
